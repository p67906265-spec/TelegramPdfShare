name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # GitHub ubuntu-latest ha gia' Android SDK installato.
      # Non usiamo android-actions/setup-android: quel task puo' riscaricare
      # i Command Line Tools e stampare/riaccettare tutte le vecchie licenze.
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK: $SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p app/signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/signing/release.p12
          test -s app/signing/release.p12

      # Il vecchio repository GitHub di TDLib (AkashPriyadarshii/tdlib-android) non esiste piu'.
      # Provo piu' fonti in ordine e uso la prima il cui AAR contiene davvero
      # org.drinkless.tdlib.Client e org.drinkless.tdlib.TdApi.
      - name: Download TDLib Android AAR
        shell: bash
        run: |
          set +e
          mkdir -p app/libs

          check_aar() {
            rm -rf /tmp/aarcheck && mkdir -p /tmp/aarcheck
            unzip -q -o "$1" -d /tmp/aarcheck || return 1
            echo "--- contenuto AAR (primi file) ---"
            (cd /tmp/aarcheck && find . -type f | head -30)
            local has_api=1 has_client=1
            while IFS= read -r jar; do
              unzip -l "$jar" 2>/dev/null | grep -q 'org/drinkless/tdlib/TdApi.class' && has_api=0
              unzip -l "$jar" 2>/dev/null | grep -q 'org/drinkless/tdlib/Client.class' && has_client=0
            done < <(find /tmp/aarcheck -name '*.jar')
            if [ -d /tmp/aarcheck/classes ]; then
              [ -f /tmp/aarcheck/classes/org/drinkless/tdlib/TdApi.class ] && has_api=0
              [ -f /tmp/aarcheck/classes/org/drinkless/tdlib/Client.class ] && has_client=0
            fi
            [ $has_api -eq 0 ] && [ $has_client -eq 0 ]
          }

          found=0
          for url in \
            "https://repo1.maven.org/maven2/io/github/tdlib-android/core/0.1.0/core-0.1.0.aar" \
            "https://repo1.maven.org/maven2/io/github/tdlib-android/core/0.1.1/core-0.1.1.aar" \
            "https://jitpack.io/com/github/fazilus/tdlib-android/1.8.61/tdlib-android-1.8.61.aar" \
            "https://jitpack.io/com/github/tdlibx/td/1.8.56/td-1.8.56.aar"
          do
            echo "=================================================="
            echo "Provo: $url"
            rm -f /tmp/candidate.aar
            if curl -fL --retry 8 --retry-delay 20 --retry-all-errors -m 900 "$url" -o /tmp/candidate.aar \
               && [ -s /tmp/candidate.aar ] && check_aar /tmp/candidate.aar; then
              cp /tmp/candidate.aar app/libs/core-release.aar
              echo "OK: uso $url"
              found=1
              break
            fi
            echo "Scartato: $url"
          done

          if [ $found -ne 1 ]; then
            echo "Nessuna fonte TDLib valida (serve un AAR con org.drinkless.tdlib.Client e TdApi)"
            exit 1
          fi
          ls -lh app/libs/core-release.aar

      - name: Build signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          gradle --version
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" TelegramPdfShare-v0.15.apk
          sha256sum TelegramPdfShare-v0.15.apk > TelegramPdfShare-v0.15.sha256.txt
          ls -lh TelegramPdfShare-v0.15.apk TelegramPdfShare-v0.15.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPdfShare-v0.15-signed
          path: |
            TelegramPdfShare-v0.15.apk
            TelegramPdfShare-v0.15.sha256.txt
          if-no-files-found: error
          retention-days: 30
