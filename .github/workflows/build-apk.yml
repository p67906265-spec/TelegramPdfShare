name: Build signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # GitHub ubuntu-latest ha gia' Android SDK installato.
      # Non usiamo android-actions/setup-android: quel task puo' riscaricare
      # i Command Line Tools e stampare/riaccettare tutte le vecchie licenze.
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID SDK: $SDK_ROOT"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager non trovato"
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p app/signing
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/signing/release.p12
          test -s app/signing/release.p12

      - name: Download TDLib Android AAR
        shell: bash
        run: |
          set -e
          mkdir -p app/libs
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/AkashPriyadarshii/tdlib-android/releases/latest/download/core-release.aar \
            -o app/libs/core-release.aar
          test -s app/libs/core-release.aar
          ls -lh app/libs/core-release.aar

      - name: Build signed release
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: signing/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          gradle --version
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" TelegramPdfShare-v0.14.apk
          sha256sum TelegramPdfShare-v0.14.apk > TelegramPdfShare-v0.14.sha256.txt
          ls -lh TelegramPdfShare-v0.14.apk TelegramPdfShare-v0.14.sha256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramPdfShare-v0.14-signed
          path: |
            TelegramPdfShare-v0.14.apk
            TelegramPdfShare-v0.14.sha256.txt
          if-no-files-found: error
          retention-days: 30
